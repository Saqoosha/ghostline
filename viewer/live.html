<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ghostline live</title>
    <style>
      :root { --ink: #16181d; --muted: #6b7180; --line: #d9dce3; --panel: rgba(255, 255, 255, 0.9); --bg: #e9ebef; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
      #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #panel { position: fixed; left: 12px; top: 12px; z-index: 2; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
               display: grid; gap: 6px; font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #panel .row { display: flex; gap: 10px; align-items: center; white-space: pre; }
      #state { font: 700 13px ui-sans-serif, system-ui, sans-serif; letter-spacing: .03em; padding: 2px 8px; border-radius: 6px; color: #fff; background: #b3261e; min-width: 92px; text-align: center; }
      #state.ok { background: #0a7d5a; } #state.hold { background: #b06a00; }
      #panel [hidden] { display: none; } #panel label { display: flex; gap: 6px; align-items: center; } #panel input[type=range] { width: 90px; }
      #panel button { height: 24px; padding: 0 9px; border: 0; border-radius: 6px; background: var(--ink); color: #fff; font: 600 12px ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
      #dvr { position: fixed; right: 12px; top: 12px; z-index: 2; width: min(30vw, 440px); aspect-ratio: 4 / 3; overflow: hidden; border-radius: 8px; border: 1px solid var(--line); background: #000; }
      #dvr video { position: absolute; height: 100%; left: 50%; transform: translateX(-50%); }   /* 16:9 capture, the 4:3 picture in its middle */
      #dvr span { position: absolute; left: 6px; bottom: 4px; color: #fff; font: 11px ui-monospace, Menlo, monospace; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="panel">
      <div class="row"><span id="state">CONNECTING</span><span id="info"></span></div>
      <div class="row"><label>trail <input id="dur" type="range" min="0.5" max="60" step="0.5" value="3" /><span id="durv"></span></label><label>smooth <input id="ws" type="range" min="0.1" max="1" step="0.05" value="0.4" /><span id="wsv"></span></label><label>delay <input id="delay" type="range" min="0" max="500" step="10" value="100" /><span id="delayv"></span></label><button id="clear">clear</button><button id="resetview">reset view</button></div>
      <div class="row" id="replaybar" hidden><button id="play">pause</button><input id="seek" type="range" min="0" max="1" step="0.01" value="0" style="width: 420px" /><span id="clock"></span></div>
    </div>
    <div id="dvr"><video id="video" muted playsinline></video><span id="dvrinfo"></span></div>
    <script type="module" src="/src/livepage.ts"></script>
  </body>
</html>
