<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JDL-2026-R6 — DVR on the scan</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; background: #0c0c0e; color: #ddd; font: 13px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
      #app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; height: 100%; }
      /* min 0 + an absolutely placed canvas: resizeCanvas writes px sizes on the canvas, and a
         canvas in flow would then hold its grid cell open when the window shrinks */
      #view { position: relative; background: #000; min-width: 0; min-height: 0; overflow: hidden; }
      #view canvas { position: absolute; left: 0; top: 0; display: block; }
      #dvr { position: relative; background: #000; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; overflow: hidden; }
      #dvr video { max-width: 100%; max-height: 100%; }
      /* compare: the video sits over the 3D view and a wipe reveals the render underneath */
      /* compare: the canvas spans both cells (free camera left, matched camera right) */
      #app.compare #view { grid-column: 1 / -1; }
      /* transparent: the box covers the 3D view, and only the video is clipped by the wipe */
      #app.compare #dvr { position: absolute; inset: 0; bottom: var(--bar, 92px); pointer-events: none; background: transparent; }
      #app.compare #dvr video { width: 100%; height: 100%; object-fit: contain; clip-path: inset(0 0 0 var(--wipe, 50%)); }
      /* marks: an overlay the size of the video's picture; it takes the clicks in mark mode */
      #marks { position: absolute; pointer-events: none; }
      #app.marking #dvr { pointer-events: auto; } #app.marking #marks { pointer-events: auto; cursor: crosshair; }
      #markbar { color: #bbb; } #markbar select { min-width: 8ch; }
      #bar { grid-column: 1 / -1; padding: 8px 12px; background: #16161a; border-top: 1px solid #2a2a30; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      #bar label { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
      #bar input[type=range] { width: 100%; }
      #timeline { flex: 1 1 100%; display: flex; gap: 8px; align-items: center; }
      #status { position: absolute; left: 10px; top: 8px; color: #9ad; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 4px; pointer-events: none; white-space: pre; }
      #legend { color: #999; white-space: nowrap } #legend i { font-style: normal }
      button { background: #26262c; color: #ddd; border: 1px solid #3a3a42; border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
      button.on { background: #3b5bdb; border-color: #5b7bfb; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="view"><canvas id="c"></canvas><div id="status">loading…</div></div>
      <div id="dvr"><video id="video" src="data/dvr_pinhole.mp4" muted playsinline preload="auto"></video><video id="scanvideo" muted playsinline preload="auto" hidden></video><canvas id="marks"></canvas></div>
      <div id="bar">
        <div id="timeline">
          <button id="play">play</button>
          <span id="tlabel" style="min-width:24ch">80.000 s  #0</span>
          <label>speed <select id="rate"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option></select>×</label>
          <input id="seek" type="range" min="0" max="5875" step="1" value="0" />
        </div>
        <label><input type="checkbox" id="follow" /> follow DVR camera</label>
        <label><input type="checkbox" id="compare" /> compare (wipe)</label>
        <label>wipe <input type="range" id="wipe" min="0" max="100" value="50" style="width:120px" /></label>
        <label><input type="checkbox" id="showScan" /> scan cameras</label>
        <label><input type="checkbox" id="showPath" checked /> DVR path</label>
        <span id="legend"><i style="color:#4dff66">■</i> colmap <i style="color:#ff9926">■</i> lk <i style="color:#ff4dd9">■</i> interp <i style="color:#4dd9ff">■</i> refined <i style="color:#8c8c8c">■</i> ground <i style="color:#ffe14d">■</i> manual</span>
        <label>poses <select id="poseset"><option value="poses60_refined15.json">refined (all + marks)</option><option value="poses60_init15.json">interpolated (marks, before refine)</option><option value="poses60_refined10.json">refined (before marks)</option></select></label>
        <label>colours <select id="scene"><option value="JDL-2026-R6-fix-web-edit">colour edit</option><option value="JDL-2026-R6-fix-web">original</option></select></label>
        <label>scan cam <input id="scancam" type="number" min="-1" max="646" value="-1" style="width:6ch" /> <span id="scanlabel"></span></label>
        <span id="markbar"><label><input type="checkbox" id="markmode" /> mark</label> landmark <select id="landmark"></select> <button id="newlm">+ new</button> <button id="undomark">undo</button> ground y <input id="groundy" type="number" step="0.1" value="1.5" style="width:6ch" /> <button id="resetlm">reset 3D</button> <button id="dlmarks">download</button> <span id="markinfo"></span></span>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
