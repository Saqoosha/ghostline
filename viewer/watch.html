<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ghostline live</title>
  </head>
  <body class="stage">
    <canvas id="c"></canvas>
    <header class="bar top">
      <a id="home" class="mark" href="./"><span>ghost</span><i></i><span>line</span></a>
      <span class="what" id="title"></span>
      <span class="what" id="heat"></span>
      <span class="live" id="live">NO HEAT</span>
      <span class="grow"></span>
      <span class="delay" title="配信に合わせて表示を遅らせる（名前・ヒートの切り替えも同じだけ遅れる）">DELAY
        <button class="btn" id="dminus" aria-label="0.5 秒短く">−</button><output id="dv"></output><button class="btn" id="dplus" aria-label="0.5 秒長く">＋</button>
        <span class="seg" id="dp"></span></span>
      <span class="seg" id="cams"></span>
    </header>
    <nav class="pilots" id="pilots" hidden></nav>
    <div class="note" id="note">接続中…</div>
    <footer class="bar foot">
      <span>位置は<wbr>各機の DVR 映像から<wbr>推定したもので、<wbr>公式の記録では<wbr>ありません。</span>
      <span class="grow"></span>
      <a id="prev" hidden></a>
    </footer>
    <script type="module" src="/src/watch.ts"></script>
  </body>
</html>
