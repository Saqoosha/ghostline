  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased;

  .mark span:last-child { margin-right: -.42em; }
  .mark i { flex: 1; height: 1.5px; background: linear-gradient(90deg, var(--tl), var(--tr), var(--bl), var(--br)); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: baseline; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--faint); }
  li:first-child { border-top: 1px solid var(--faint); }
  a { color: var(--ink); text-decoration: none; }
  li > a:first-child { flex: 1; font: 300 16px/1.3 var(--sans); letter-spacing: .06em; }
  .sub { font: 400 11px var(--mono); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; white-space: nowrap; }
  a:hover { color: var(--br); }
</style>
